server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: quiz-card

  # ============ MySQL 数据源（账号密码从环境变量读取） ============
  datasource:
    url: jdbc:mysql://localhost:3306/quiz_card?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============ 启动时自动建表（schema.sql 中 CREATE TABLE IF NOT EXISTS） ============
  sql:
    init:
      mode: always
      continue-on-error: false

  # ============ Spring AI：对接阿里百炼（DashScope OpenAI 兼容模式） ============
  # 密钥只从系统环境变量 ALI_BABA_API_KEY 读取，禁止硬编码
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${ALI_BABA_API_KEY:}
      chat:
        options:
          # 模型名可配置（百炼模型名，例如 qwen-flash / qwen-plus / qwen-max）
          model: ${AI_MODEL_NAME:qwen-flash}
          temperature: 0.7

# ============ MyBatis-Plus 配置 ============
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null
  mapper-locations: classpath*:/mapper/**/*.xml

# ============ Knife4j 配置 ============
knife4j:
  enable: true
  setting:
    language: zh_cn
  basic:
    enable: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      display-name: 题目抽卡 API
